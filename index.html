<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jeatream: aplicaciones y proyectos de Carnesito, incluyendo RetroBoy para Android.">
  <title>Jeatream — Carnesito</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10141d; color: #f3f5f8; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 680px); padding: clamp(28px, 7vw, 56px); border: 1px solid #30394a; border-radius: 24px; background: #171e2b; box-shadow: 0 24px 80px #0005; }
    .eyebrow { color: #9ab4ff; font-size: .82rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1.05; }
    p { color: #c5ccda; font-size: 1.08rem; line-height: 1.7; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    a { display: inline-block; padding: 12px 16px; border-radius: 12px; color: #fff; background: #354a78; text-decoration: none; font-weight: 650; }
    a:hover, a:focus-visible { background: #4865a2; }
    a.secondary { background: #293241; }
    footer { margin-top: 32px; color: #8f9aae; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Carnesito · Jeatream</div>
    <h1>Juega a tu manera.</h1>
    <p>Jeatream reúne aplicaciones y proyectos para Android. Conoce RetroBoy, un emulador de Game Boy y Game Boy Advance.</p>
    <nav aria-label="Enlaces">
      <a href="https://carnesito.github.io/jeatream/">Visitar Jeatream</a>
      <a class="secondary" href="https://carnesito.github.io/jeatream/privacidad-retroboy.html">Privacidad de RetroBoy</a>
    </nav>
    <footer>© Carnesito · Soporte: <a class="secondary" href="mailto:jeatreamapps@gmail.com">jeatreamapps@gmail.com</a></footer>
  </main>
</body>
</html>
